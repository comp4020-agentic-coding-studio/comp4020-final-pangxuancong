<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chain Reaction</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="desk">
      <header>
        <h1>Chain Reaction <span id="where" class="where"></span></h1>
        <ul id="roster" class="roster" aria-label="Players this round"></ul>
        <a class="about" href="/readme/">What is this?</a>
      </header>

      <p id="phase" class="phase" role="status" aria-live="polite">Connecting…</p>

      <div class="stage">
        <div id="game" class="game"></div>
        <div id="overlay" class="overlay" hidden></div>
      </div>

      <section id="build" class="build" aria-label="Build" hidden>
        <div id="tray" class="tray" role="toolbar" aria-label="Pieces"></div>
        <div class="actions">
          <button id="rotate" type="button" class="quiet" title="Rotate (R)">Rotate</button>
          <button id="cancel" type="button" class="quiet" title="Cancel (Esc)">Cancel</button>
          <button id="skip" type="button" class="quiet">Skip</button>
          <button id="commit" type="button" class="primary" title="Enter">Place</button>
        </div>
      </section>

      <p id="message" class="message" aria-live="polite"></p>
      <p id="help" class="help"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
