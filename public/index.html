<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chain Reaction</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="desk">
      <header>
        <h1>Chain Reaction <span class="machine-no">Machine #01</span></h1>
        <a href="/readme/">What is this?</a>
      </header>

      <figure class="machine">
        <svg id="machine" role="img" aria-labelledby="machine-desc" viewBox="0 24 760 380">
          <desc id="machine-desc">A ball rests at the top of a wooden ramp. It rolls down, leaves the lip and should land in a cup on the floor.</desc>
          <line class="floor" x1="20" x2="740" y1="380" y2="380" />
          <g id="cup"></g>
          <line class="post" id="post" />
          <g id="ramp">
            <line class="plank" id="plank" />
            <line class="lip" id="lip" />
            <circle class="pivot" id="pivot" r="4" />
          </g>
          <circle class="ball" id="ball" r="9" />
        </svg>
      </figure>

      <section class="controls" aria-label="Ramp control">
        <label for="angle">Ramp angle <output id="angle-out" for="angle">–</output></label>
        <input id="angle" type="range" step="1" disabled />
        <button id="run" type="button" disabled>Run</button>
      </section>

      <p id="status" class="status" role="status" aria-live="polite">Loading the machine…</p>
      <p id="trace" class="trace"></p>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
